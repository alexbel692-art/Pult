name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Сборка агента
        run: dotnet publish Shturval.Agent/Shturval.Agent.csproj -c Release -o out/agent

      - name: Сборка консоли
        run: dotnet publish Shturval.Viewer/Shturval.Viewer.csproj -c Release -o out/viewer

      - name: Упаковка
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/agent/ShturvalAgent.exe dist/
          Copy-Item out/viewer/Shturval.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath Shturval-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Shturval-win-x64
          path: dist/

      - name: Последняя сборка в Releases (каждый push в main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest Shturval-win-x64.zip dist/ShturvalAgent.exe dist/Shturval.exe `
            --target $env:GITHUB_SHA --prerelease `
            --title "Последняя сборка" `
            --notes "Автосборка из main ($($env:GITHUB_SHA.Substring(0,7))). ShturvalAgent.exe — на компьютеры, Shturval.exe — на сервер."

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Shturval-win-x64.zip
